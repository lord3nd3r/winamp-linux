<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" role="img" aria-label="Winamp for Linux">
  <title>Winamp for Linux</title>
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c6168"/>
      <stop offset="0.18" stop-color="#2c3036"/>
      <stop offset="0.82" stop-color="#1a1d21"/>
      <stop offset="1" stop-color="#0c0d0f"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2e34"/>
      <stop offset="1" stop-color="#14171b"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07140a"/>
      <stop offset="1" stop-color="#020604"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0b6b12"/>
      <stop offset="0.55" stop-color="#3dff3a"/>
      <stop offset="1" stop-color="#d8ff6a"/>
    </linearGradient>
  </defs>
  <!-- gunmetal bezel -->
  <rect width="1100" height="220" rx="6" fill="url(#bezel)"/>
  <rect x="2" y="2" width="1096" height="2" fill="#8b929c"/>
  <rect x="2" y="216" width="1096" height="2" fill="#050506"/>
  <rect x="8" y="8" width="1084" height="204" rx="3" fill="url(#face)"/>
  <rect x="8" y="8" width="1084" height="1" fill="#6e7580"/>
  <rect x="8" y="211" width="1084" height="1" fill="#0a0b0d"/>

  <!-- title strip -->
  <rect x="18" y="16" width="1064" height="18" fill="#101216"/>
  <rect x="18" y="16" width="1064" height="1" fill="#4a515a"/>
  <text x="28" y="29" fill="#c8ccd2" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">WINAMP</text>
  <text x="1040" y="29" fill="#8d949e" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="10" text-anchor="end">2.x  ·  LINUX</text>

  <!-- LCD -->
  <rect x="22" y="44" width="620" height="118" rx="2" fill="url(#lcd)" stroke="#0a0c0e" stroke-width="2"/>
  <rect x="24" y="46" width="616" height="1" fill="#16301c"/>
  <text x="40" y="92" fill="#39ff14" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="42" font-weight="700" letter-spacing="3">WINAMP</text>
  <text x="40" y="124" fill="#1f8f28" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="16" letter-spacing="1.2">IT REALLY WHIPS THE LLAMA'S ASS</text>
  <text x="40" y="148" fill="#7dff57" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="13" letter-spacing="2">ON LINUX</text>

  <!-- spectrum -->
  <g transform="translate(670,52)">
    <rect width="390" height="102" rx="2" fill="#070a08" stroke="#10140f"/>
    <g fill="url(#bar)">
      <rect x="16" y="62" width="14" height="28"/>
      <rect x="36" y="48" width="14" height="42"/>
      <rect x="56" y="34" width="14" height="56"/>
      <rect x="76" y="18" width="14" height="72"/>
      <rect x="96" y="28" width="14" height="62"/>
      <rect x="116" y="10" width="14" height="80"/>
      <rect x="136" y="22" width="14" height="68"/>
      <rect x="156" y="40" width="14" height="50"/>
      <rect x="176" y="16" width="14" height="74"/>
      <rect x="196" y="30" width="14" height="60"/>
      <rect x="216" y="8" width="14" height="82"/>
      <rect x="236" y="24" width="14" height="66"/>
      <rect x="256" y="44" width="14" height="46"/>
      <rect x="276" y="20" width="14" height="70"/>
      <rect x="296" y="36" width="14" height="54"/>
      <rect x="316" y="50" width="14" height="40"/>
      <rect x="336" y="28" width="14" height="62"/>
      <rect x="356" y="56" width="14" height="34"/>
    </g>
    <rect y="90" width="390" height="12" fill="#050705"/>
  </g>

  <!-- lightning bolt -->
  <g transform="translate(1018,168)">
    <polygon points="28,0 8,28 22,28 6,52 40,20 24,20 42,0" fill="#ffe14a" stroke="#8a6a10" stroke-width="1"/>
  </g>

  <!-- bottom status -->
  <rect x="22" y="174" width="1040" height="26" fill="#101216"/>
  <rect x="22" y="174" width="1040" height="1" fill="#3a4048"/>
  <text x="34" y="192" fill="#39ff14" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12">128 kbps</text>
  <text x="150" y="192" fill="#39ff14" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12">44 kHz</text>
  <text x="260" y="192" fill="#7dff57" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12">stereo</text>
  <text x="1048" y="192" fill="#9aa0a8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12" text-anchor="end">v1.4.0</text>
</svg>
