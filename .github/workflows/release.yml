name: Build & Release

# Multi-distro packages for major Linux families.
# Native .deb / .rpm where the distro ships classic projectM (3.x API).
# Arch is omitted: only projectM 4.x is packaged (incompatible API).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Debian family ---
          # Base images are pinned by digest (WA-003): a mutable `:tag` lets the registry
          # silently swap the toolchain a release build compiles with. Bump deliberately.
          - distro: ubuntu-22.04
            image: ubuntu:22.04@sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982
            family: deb
          - distro: ubuntu-24.04
            image: ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
            family: deb
          - distro: ubuntu-resolute
            image: ubuntu:resolute@sha256:3131b4cc82a783df6c9df078f86e01819a13594b865c2cad47bd1bca2b7063bb
            family: deb
          - distro: debian-bookworm
            image: debian:bookworm@sha256:9344f8b8992482f80cba753f323adeaf17690076c095ccff6cc9536be98185dc
            family: deb
          - distro: debian-trixie
            image: debian:trixie@sha256:fac46bff2e02f51425b6e33b0e1169f55dfb053d83511ca28aa50c09fd5ed7a4
            family: deb
          # --- RPM family ---
          - distro: fedora-41
            image: fedora:41@sha256:f1a3fab47bcb3c3ddf3135d5ee7ba8b7b25f2e809a47440936212a3a50957f3d
            family: rpm
          - distro: fedora-42
            image: fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814
            family: rpm
          - distro: opensuse-tumbleweed
            image: opensuse/tumbleweed@sha256:18a8c2a41252a0100ae4a7dae0a0e925fb522971645b97b05c57f9b6e73c3b4f
            family: suse

    steps:
      - name: Install bootstrap tools (deb)
        if: matrix.family == 'deb'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git tar file dpkg-dev

      - name: Install bootstrap tools (rpm)
        if: matrix.family == 'rpm'
        run: |
          dnf -y install git tar file rpm-build rpmdevtools which

      - name: Install bootstrap tools (suse)
        if: matrix.family == 'suse'
        run: |
          zypper --non-interactive --gpg-auto-import-keys refresh
          zypper --non-interactive install -y git tar file rpm-build which gzip

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build dependencies (deb)
        if: matrix.family == 'deb'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            qt6-base-dev \
            qt6-multimedia-dev \
            libqt6opengl6-dev \
            libgl1-mesa-dev \
            libprojectm-dev \
            projectm-data \
            libtag1-dev \
            pkg-config \
            python3 \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-libav \
            libxkbcommon0 \
            libegl1

      - name: Install build dependencies (rpm)
        if: matrix.family == 'rpm'
        run: |
          dnf -y install \
            cmake \
            ninja-build \
            gcc-c++ \
            pkgconf-pkg-config \
            qt6-qtbase-devel \
            qt6-qtmultimedia-devel \
            mesa-libGL-devel \
            libprojectM-devel \
            taglib-devel \
            pkgconf-pkg-config \
            python3 \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            gstreamer1-plugins-good \
            libxkbcommon \
            mesa-libEGL

      - name: Install build dependencies (suse)
        if: matrix.family == 'suse'
        run: |
          zypper --non-interactive install -y --force-resolution \
            cmake \
            ninja \
            gcc-c++ \
            pkgconf \
            qt6-base-devel \
            qt6-multimedia-devel \
            qt6-multimediawidgets-devel \
            qt6-widgets-devel \
            qt6-opengl-devel \
            qt6-openglwidgets-devel \
            qt6-printsupport-devel \
            Mesa-libGL-devel \
            projectM-devel \
            projectM-data \
            libtag-devel \
            python3 \
            gstreamer-devel \
            gstreamer-plugins-base-devel \
            gstreamer-plugins-good \
            libxkbcommon0 \
            Mesa-libEGL1

      - name: Configure
        run: |
          if [ "${{ matrix.family }}" = "deb" ]; then
            GENERATORS="DEB;TGZ"
          else
            GENERATORS="RPM;TGZ"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWINAMP_DISTRO_ID="${{ matrix.distro }}" \
            -DCPACK_GENERATOR="${GENERATORS}"

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: |
          export QT_QPA_PLATFORM=offscreen
          ctest --test-dir build --output-on-failure

      - name: Package
        run: ninja -C build package

      - name: List packages
        run: |
          echo "Artifacts for ${{ matrix.distro }}:"
          ls -la build/winamp-* || true
          find build -maxdepth 1 -type f \( -name 'winamp-*.deb' -o -name 'winamp-*.rpm' -o -name 'winamp-*.tar.gz' \) -print

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.distro }}
          path: |
            build/winamp-*.deb
            build/winamp-*.rpm
            build/winamp-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    # Publish even if some matrix cells failed; only successful artifacts upload.
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true

      - name: Show release bundle
        run: |
          mapfile -t files < <(find dist -type f \( -name 'winamp-*.deb' -o -name 'winamp-*.rpm' -o -name 'winamp-*.tar.gz' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No packages downloaded — all matrix builds failed?"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          du -sh "${files[@]}"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Winamp for Linux ${{ github.ref_name }}
          files: |
            dist/winamp-*.deb
            dist/winamp-*.rpm
            dist/winamp-*.tar.gz
          draft: false
          # beta / rc / alpha tags are prereleases; v1.0.0 is a full release
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Winamp for Linux ${{ github.ref_name }}

            Multi-distro packages built by GitHub Actions:

            | Family | Distros |
            |--------|---------|
            | **.deb** | Ubuntu 22.04, 24.04, Resolute · Debian Bookworm, Trixie |
            | **.rpm** | Fedora 41, 42 · openSUSE Tumbleweed |
            | **.tar.gz** | Same matrix (portable install layout) |

            Pick the package matching your distribution. Runtime codecs come from your system’s Qt Multimedia / GStreamer (or FFmpeg) stack.

            Arch Linux is not packaged here (upstream projectM 4.x API mismatch); build from source if needed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
