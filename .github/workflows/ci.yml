name: CI

# Build and test on major Linux distros for every PR and push to master.
# Packaging is handled by release.yml (tags / workflow_dispatch).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Base images are pinned by digest (WA-003): a mutable `:tag` lets the registry
          # silently swap the toolchain CI compiles with. Bump deliberately.
          - distro: ubuntu-24.04
            image: ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
            family: deb
          - distro: ubuntu-22.04
            image: ubuntu:22.04@sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982
            family: deb
          - distro: debian-bookworm
            image: debian:bookworm@sha256:9344f8b8992482f80cba753f323adeaf17690076c095ccff6cc9536be98185dc
            family: deb
          - distro: fedora-41
            image: fedora:41@sha256:f1a3fab47bcb3c3ddf3135d5ee7ba8b7b25f2e809a47440936212a3a50957f3d
            family: rpm
          - distro: opensuse-tumbleweed
            image: opensuse/tumbleweed@sha256:18a8c2a41252a0100ae4a7dae0a0e925fb522971645b97b05c57f9b6e73c3b4f
            family: suse

    steps:
      - name: Install bootstrap tools (deb)
        if: matrix.family == 'deb'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - name: Install bootstrap tools (rpm)
        if: matrix.family == 'rpm'
        run: dnf -y install git which

      - name: Install bootstrap tools (suse)
        if: matrix.family == 'suse'
        run: |
          zypper --non-interactive --gpg-auto-import-keys refresh
          zypper --non-interactive install -y git which

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build dependencies (deb)
        if: matrix.family == 'deb'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential pkg-config \
            qt6-base-dev qt6-multimedia-dev libqt6opengl6-dev libgl1-mesa-dev \
            libprojectm-dev projectm-data libtag1-dev pkg-config python3 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            libxkbcommon0 libegl1

      - name: Install build dependencies (rpm)
        if: matrix.family == 'rpm'
        run: |
          dnf -y install \
            cmake ninja-build gcc-c++ pkgconf-pkg-config \
            qt6-qtbase-devel qt6-qtmultimedia-devel mesa-libGL-devel \
            libprojectM-devel taglib-devel python3 \
            gstreamer1-devel gstreamer1-plugins-base-devel gstreamer1-plugins-good \
            libxkbcommon mesa-libEGL

      - name: Install build dependencies (suse)
        if: matrix.family == 'suse'
        run: |
          zypper --non-interactive install -y --force-resolution \
            cmake ninja gcc-c++ pkgconf \
            qt6-base-devel qt6-multimedia-devel qt6-multimediawidgets-devel \
            qt6-widgets-devel qt6-opengl-devel qt6-openglwidgets-devel \
            qt6-printsupport-devel \
            Mesa-libGL-devel projectM-devel projectM-data libtag-devel python3 \
            gstreamer-devel gstreamer-plugins-base-devel gstreamer-plugins-good \
            libxkbcommon0 Mesa-libEGL1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: |
          export QT_QPA_PLATFORM=offscreen
          ctest --test-dir build --output-on-failure
